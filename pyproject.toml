[project]
name = "voice-to-video-pipeline"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "dsadrianzadeh", email = "danial.sadrianzadeh@gmail.com" }
]
requires-python = ">=3.15"
dependencies = [
    "numpy>=2.5.4",
    "python-dotenv>=1.2.4",
    "requests>=2.34.2",
    "sounddevice>=0.5.6",
    "soundfile>=0.14.0",
]

[project.scripts]
voice-to-video-pipeline = "voice_to_video_pipeline:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
